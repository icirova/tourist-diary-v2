services:
  backend:
    build: ./server
    env_file: ./server/.env
    restart: unless-stopped
    volumes:
      - tourist_photos:/data/uploads
    networks: [app]
    command: ["sh", "-c", "npm run migrate && npm start"]

  frontend:
    build:
      context: .
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [backend]
    networks: [app]

volumes:
  tourist_photos:
networks:
  app:
